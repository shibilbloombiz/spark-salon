<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Latest works — Spiral Flux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ececec;
      color: #161616;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Track 400vh / 400dvh tall */
    .sf-track {
      position: relative;
      height: 400vh;
      height: 400dvh;
      background: #ececec;
    }

    /* Sticky stage 100vh / 100dvh tall with overflow hidden */
    .sf-export {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ececec;
      will-change: transform, clip-path;
    }

    .sf-host,
    .sf-frame {
      width: 100%;
      height: 100%;
    }

    .sf-frame {
      display: grid;
      place-items: center;
    }

    .sf-root {
      position: relative;
      width: min(100%, var(--sf-w, 1920px));
      height: min(100%, var(--sf-h, 1080px));
      overflow: hidden;
      background: var(--sf-bg, #ececec);
      color: var(--sf-ink, #161616);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      touch-action: pan-y;
      user-select: none;
      container-type: size;
      isolation: isolate;
      outline: none;
    }

    .sf-root[data-draggable] {
      cursor: grab;
    }

    .sf-root[data-dragging] {
      cursor: grabbing;
    }

    .sf-root:focus-visible {
      outline: 2px solid var(--sf-ink, #161616);
      outline-offset: -3px;
    }

    .sf-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .sf-root [hidden] {
      display: none;
    }

    /* Title in top-left corner with #ececec solid chip */
    .sf-title {
      position: absolute;
      z-index: 1;
      top: max(20px, calc(var(--navbar-height, 60px) + 12px));
      left: max(20px, calc(2.5% + env(safe-area-inset-left, 0px)));
      margin: 0;
      pointer-events: none;
      font: 600 clamp(20px, 3.4cqw, 44px) / 1.02 Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.025em;
      color: var(--sf-ink, #161616);
      background: var(--sf-bg, #ececec);
      padding: 0.22em 0.5em 0.26em 0.1em;
      border-radius: 0.3em;
      will-change: transform, opacity;
    }

    .sf-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      box-sizing: border-box;
      touch-action: pan-x pan-y;
    }

    .sf-fallback img {
      flex: 0 0 46%;
      min-width: 46%;
      width: 46%;
      aspect-ratio: var(--sf-aspect, 1.05);
      object-fit: cover;
      scroll-snap-align: center;
    }

    .sf-root[data-ready] .sf-fallback {
      visibility: hidden;
    }

    .sf-fallback img:first-child {
      margin-left: 27%;
    }

    .sf-fallback img:last-child {
      margin-right: 27%;
    }

    /* Arrow buttons: hidden until hover/focus on fine pointers, always visible on touch */
    .sf-step {
      position: absolute;
      z-index: 2;
      top: 50%;
      width: 44px;
      height: 44px;
      transform: translateY(-50%);
      border: 1px solid currentColor;
      border-radius: 50%;
      background: var(--sf-bg, #ececec);
      color: inherit;
      font: 20px / 1 system-ui;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .sf-prev {
      left: max(12px, calc(12px + env(safe-area-inset-left, 0px)));
    }

    .sf-next {
      right: max(12px, calc(12px + env(safe-area-inset-right, 0px)));
    }

    @media (hover: hover) and (pointer: fine) {
      .sf-root:hover .sf-step,
      .sf-step:focus-visible,
      .sf-root:focus-visible .sf-step {
        opacity: 1;
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
    }

    @media (hover: none), (pointer: coarse) {
      .sf-step {
        opacity: 1;
        background: var(--sf-bg, #ececec);
      }
    }

    .sf-live {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .sf-root[data-preview] .sf-step {
      display: none;
    }

    @container (max-width: 600px) {
      .sf-fallback img {
        flex-basis: 82%;
        min-width: 82%;
        width: 82%;
      }
      .sf-fallback img:first-child {
        margin-left: 9%;
      }
      .sf-fallback img:last-child {
        margin-right: 9%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sf-step {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <section class="sf-track" id="gallery" aria-label="Latest works">
    <div class="sf-export" role="region" aria-roledescription="carousel" aria-label="Latest works">
      <div class="sf-frame" style="--sf-w:1920px;--sf-h:1080px;--sf-bg:#ececec;--sf-ink:#161616;--sf-aspect:1.05">
        <div class="sf-root" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Latest works. Drag, scroll or use the arrow keys.">
          <canvas class="sf-canvas" aria-hidden="true"></canvas>
          <div class="sf-fallback" role="list">
            <img role="listitem" src="/works/1.jpg" alt="Latest work 1" draggable="false">
            <img role="listitem" src="/works/2.jpg" alt="Latest work 2" draggable="false">
            <img role="listitem" src="/works/3.jpg" alt="Latest work 3" draggable="false">
            <img role="listitem" src="/works/4.jpg" alt="Latest work 4" draggable="false">
            <img role="listitem" src="/works/5.jpg" alt="Latest work 5" draggable="false">
            <img role="listitem" src="/works/6.jpg" alt="Latest work 6" draggable="false">
            <img role="listitem" src="/works/7.jpg" alt="Latest work 7" draggable="false">
            <img role="listitem" src="/works/8.jpg" alt="Latest work 8" draggable="false">
            <img role="listitem" src="/works/9.jpg" alt="Latest work 9" draggable="false">
            <img role="listitem" src="/works/10.jpg" alt="Latest work 10" draggable="false">
          </div>
          <p class="sf-title" data-sf-title>Latest works</p>
          <button class="sf-step sf-prev" type="button" aria-label="Previous photo">←</button>
          <button class="sf-step sf-next" type="button" aria-label="Next photo">→</button>
          <span class="sf-live" aria-live="polite" aria-atomic="true"></span>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    function createSpiralFlux(root, initial) {
      const canvas = root.querySelector('.sf-canvas');
      const ctx = canvas.getContext('2d');
      const live = root.querySelector('.sf-live');
      const fallback = root.querySelector('.sf-fallback');
      let config = initial;
      let width = 1, height = 1, focal = 1, stride = 1, dpr = 1;
      let images = [], sources = [], position = 0, target = 0, last = 0, frame = 0;
      let wave = 0, dragging = null, destroyed = false, visible = true, active = -1, holdUntil = 0;
      const listeners = [];
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2, RAD = Math.PI / 180;
      const mod = (n, d) => ((n % d) + d) % d;
      const listen = (el, type, fn, options) => {
        if (!el) return;
        el.addEventListener(type, fn, options);
        listeners.push(() => el.removeEventListener(type, fn, options));
      };
      const fallbackImages = (urls) => {
        if (!fallback) return;
        fallback.replaceChildren(...urls.map((src, i) => {
          const image = document.createElement('img');
          image.src = src;
          image.alt = `Latest work ${i + 1}`;
          image.draggable = false;
          image.setAttribute('role', 'listitem');
          return image;
        }));
      };

      if (!ctx) {
        const scroll = (direction) => fallback.scrollBy({ left: direction * root.clientWidth * 0.599999, behavior: motion.matches ? 'instant' : 'smooth' });
        listen(root.querySelector('.sf-prev'), 'click', () => scroll(-1));
        listen(root.querySelector('.sf-next'), 'click', () => scroll(1));
        listen(root, 'keydown', (event) => {
          if (event.target === root && ['ArrowLeft', 'ArrowRight'].includes(event.key)) {
            event.preventDefault();
            scroll(event.key === 'ArrowRight' ? 1 : -1);
          }
        });
        return {
          update(next) { fallbackImages(next.images); },
          nudge() {},
          destroy() { listeners.forEach((remove) => remove()); }
        };
      }

      const geometry = () => {
        const depth = config.depth, horizon = Math.acos(1 / depth);
        const slot = (config.cardArc + config.gap) * RAD, arc = config.cardArc * RAD;
        const cardHeight = arc / config.aspect, turn = cardHeight * config.turnSpacing;
        return { depth, horizon, slot, fill: arc / slot, cardHeight, rise: turn / TAU };
      };

      const textures = new WeakMap();
      const texture = (image, th) => {
        const tw = Math.max(1, Math.round(th * config.aspect)), cached = textures.get(image);
        if (cached && cached.width === tw && cached.height === th) return cached;
        const copy = document.createElement('canvas'), copyCtx = copy.getContext('2d');
        if (!copyCtx) return null;
        copy.width = tw; copy.height = th;
        const scale = Math.max(tw / image.naturalWidth, th / image.naturalHeight);
        const sw = tw / scale, sh = th / scale;
        copyCtx.drawImage(image, (image.naturalWidth - sw) / 2, (image.naturalHeight - sh) / 2, sw, sh, 0, 0, tw, th);
        textures.set(image, copy);
        return copy;
      };

      const running = () => visible && !document.hidden && !destroyed;
      function wake() {
        if (!frame && running()) {
          last = performance.now();
          frame = requestAnimationFrame(draw);
        }
      }

      function resize() {
        const rect = root.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        const g = geometry(), oldStride = stride;
        const half = Math.min(width * (width < 600 ? 0.419999 : 0.300001), height * 0.500001) * config.size / 100;
        focal = half * Math.sqrt(g.depth * g.depth - 1);
        stride = focal * g.slot / (g.depth - 1);
        position *= stride / oldStride;
        target *= stride / oldStride;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.ceil(width * dpr);
        canvas.height = Math.ceil(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        wake();
      }

      function setImages() {
        if (JSON.stringify(sources) === JSON.stringify(config.images)) return;
        for (const image of images) { image.onload = null; image.onerror = null; }
        sources = [...config.images];
        root.removeAttribute('data-ready');
        fallbackImages(sources);
        images = sources.map((src) => {
          const image = new Image();
          image.decoding = 'async';
          image.onload = image.onerror = () => { if (!destroyed) wake(); };
          image.src = src;
          return image;
        });
        position = mod(position / stride, images.length) * stride;
        target = position;
        active = -1;
      }

      function announce() {
        const next = mod(Math.round(position / stride), images.length);
        if (next !== active) {
          active = next;
          if (!config.preview && live) live.textContent = `Latest work ${next + 1} of ${images.length}`;
        }
      }

      function draw(now) {
        frame = 0;
        if (!running()) return;
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        if (!motion.matches && !dragging && now > holdUntil) target += config.autoplay * dt;
        const old = position;
        position += (target - position) * (motion.matches ? 1 : 1 - Math.exp(-config.smoothing * dt));
        const velocity = (position - old) / Math.max(dt, 0.001);
        const amplitude = motion.matches ? 0 : Math.max(-1, Math.min(1, velocity / 1800)) * height * 0.0499999 * config.wave;
        wave += (amplitude - wave) * (1 - Math.exp(-10 * dt));
        if (motion.matches) wave = 0;

        const loop = images.length * stride;
        if (Math.abs(position) > loop * 50) {
          const cycles = Math.trunc(position / loop) * loop;
          position -= cycles;
          target -= cycles;
        }

        ctx.clearRect(0, 0, width, height);
        const { depth, horizon, slot, fill, cardHeight, rise } = geometry();
        const cx = width / 2, cy = height / 2;
        const zone = Math.min(config.edgeZone * RAD, horizon * 0.899999, (Math.PI - horizon) * 0.900001);
        const smear = Math.min(0.899999, config.smear), growth = config.flare * 0.6;

        const part = (t) => t <= 0 ? (zone + t) ** 3 / (3 * zone * zone) : 2 * zone / 3 - (zone - t) ** 3 / (3 * zone * zone);
        const family = (A, offset) => {
          const n = Math.floor((A - offset + zone) / TAU), t = A - offset - n * TAU;
          return n * 2 * zone / 3 + (t >= zone ? 2 * zone / 3 : part(t));
        };
        const warp = (A) => A - smear * (family(A, 0) + family(A, 2 * horizon));
        const shift = position / stride + fill / 2 - warp(horizon) / slot;
        const project = (theta) => focal * Math.sin(theta) / (depth - Math.cos(theta));
        const near = (theta) => Math.max(0, (zone - Math.abs(Math.abs(theta) - horizon)) / zone) ** 2;

        const reach = (height / 2 + focal * cardHeight * (1 + growth) / (depth - 1)) * (depth + 1) / focal;
        const from = horizon - reach / rise, to = horizon + reach / rise;
        const ready = (image) => image && image.complete && image.naturalWidth > 0;
        const rims = [];
        let rim = null, painted = false;
        const maxStep = 0.799999 * RAD;
        const edge = project(horizon), cutoff = 0.750001, fadeOut = 6;
        const size = Math.min(2048, Math.ceil(focal * cardHeight / (depth - 1) * (1 + growth) * dpr));

        const pass = (front) => {
          let A = from;
          while (A < to) {
            const theta = mod(A - horizon + Math.PI, TAU) - Math.PI, side = Math.abs(theta) < horizon;
            const k = near(theta);
            const speed = Math.abs(focal * (depth * Math.cos(theta) - 1) / (depth - Math.cos(theta)) ** 2);
            const step = Math.min(maxStep, (k > 0 ? 2 : 4) / Math.max(speed, 1));
            const B = A + step;
            if (side !== front) {
              rim = null;
              A += (front ? TAU - horizon - mod(theta, TAU) : horizon - theta) + 1e-6;
              continue;
            }
            const u0 = warp(A) / slot + shift, u1 = warp(B) / slot + shift;
            const at = (f, index) => {
              const angle = A + f * step, t = theta + f * step, d = depth - Math.cos(t), x = cx + project(t);
              const phase = x / width * TAU * config.frequency + position / width * 1.50001;
              const h = focal * cardHeight / d * (1 + k * growth) * (1 + Math.cos(phase) * Math.abs(wave) / height * 0.150001);
              const centre = (index + fill / 2 - shift) * slot + angle - warp(angle);
              const level = centre + config.tilt * (angle - centre);
              return { x, y: cy - focal * rise * (horizon - level) / d + Math.sin(phase) * wave, h };
            };

            for (let index = Math.floor(u0); index <= Math.floor(u1); index++) {
              const ua = Math.max(u0, index), ub = Math.min(u1, index + fill);
              if (ub <= ua) continue;
              const image = images[mod(index, images.length)], source = ready(image) && texture(image, size);
              if (!source) { rim = null; continue; }
              const fa = (ua - u0) / (u1 - u0), fb = (ub - u0) / (u1 - u0);
              const [p, q] = front ? [at(fa, index), at(fb, index)] : [at(fb, index), at(fa, index)];
              const ta = (ua - index) / fill, tb = (ub - index) / fill, h = (p.h + q.h) / 2;

              if (Math.min(p.y, q.y) - h / 2 > height || Math.max(p.y, q.y) + h / 2 < 0) { rim = null; continue; }
              const dx = q.x - p.x, wide = Math.max(dx, 0) + 1.49999, dy = dx > 0.01 ? (q.y - p.y) * wide / dx : q.y - p.y;
              const alpha = Math.min(1, (edge - Math.max(Math.abs(p.x - cx), Math.abs(p.x + wide - cx)) - cutoff) / fadeOut);
              if (alpha <= 0) continue;
              ctx.globalAlpha = alpha;
              ctx.setTransform(dpr * wide, dpr * dy, 0, dpr * h, dpr * p.x, dpr * (p.y - h / 2));
              const sx = (front ? ta : 1 - tb) * source.width, sw = (tb - ta) * source.width * (dx > 0.01 ? wide / dx : 1);
              ctx.drawImage(source, sx, 0, Math.max(0.0100001, Math.min(sw, source.width - sx)), source.height, 0, 0, 1, 1);

              if (config.fringe > 0 && k > 0) {
                const right = theta > 0;
                if (!rim || rim.index !== index || rim.right !== right) rims.push(rim = { index, right, front, points: [] });
                rim.points.push(p.x, p.y - p.h / 2, p.y + p.h / 2);
              } else rim = null;
              painted = true;
            }
            A = B;
          }
          rim = null; ctx.globalAlpha = 1; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        pass(false);
        if (config.backFade > 0) {
          ctx.save(); ctx.globalAlpha = config.backFade;
          if (config.background === 'transparent') { ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = '#000'; }
          else ctx.fillStyle = config.background || '#ececec';
          ctx.fillRect(0, 0, width, height); ctx.restore();
        }
        pass(true);

        if (rims.length) {
          const ramp = (rgb, right, front) => {
            const inner = project(front ? horizon - zone : horizon + zone), sign = right ? 1 : -1;
            const g2 = ctx.createLinearGradient(cx + sign * inner, 0, cx + sign * edge, 0);
            const span = Math.max(1, Math.abs(edge - inner)), peak = Math.max(0.399999, 1 - (cutoff + fadeOut) / span);
            g2.addColorStop(0, `rgba(${rgb},0)`); g2.addColorStop(peak * 0.35, `rgba(${rgb},${config.fringe * 0.5})`);
            g2.addColorStop(peak, `rgba(${rgb},${config.fringe})`); g2.addColorStop(1, `rgba(${rgb},0)`);
            return g2;
          };
          const line = (points, offset, top) => {
            ctx.beginPath();
            for (let i = 0; i < points.length; i += 3) ctx.lineTo(points[i], points[i + (top ? 1 : 2)] + (top ? -offset : offset));
            ctx.stroke();
          };
          ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
          for (const [rgb, thickness, offset] of [['79,168,255', 3, 1.50001], ['255,179,71', 2, -1]]) {
            ctx.lineWidth = thickness;
            for (const { points, right, front } of rims) {
              if (points.length < 6) continue;
              ctx.globalAlpha = front ? 1 : 1 - config.backFade;
              ctx.strokeStyle = ramp(rgb, right, front);
              line(points, offset, true); line(points, offset, false);
            }
          }
          ctx.restore();
        }

        root.toggleAttribute('data-ready', painted);
        if (Math.abs(target - position) < 0.499999 && !dragging) announce();
        if (dragging || Math.abs(target - position) > 0.05 || Math.abs(wave) > 0.0499999 || (!motion.matches && config.autoplay > 0)) wake();
      }

      function step(direction) { target = (Math.round(target / stride) + direction) * stride; wake(); }

      listen(root, 'wheel', (event) => {
        if (config.preview || config.wheel === 'off') return;
        const delta = config.wheel === 'horizontal' ? event.deltaX : Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
        if (!delta) return; event.preventDefault();
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? height : 1;
        target += Math.max(-width * 2, Math.min(width * 2, delta * unit * config.sensitivity)); wake();
      }, { passive: false });

      listen(root, 'pointerdown', (event) => {
        if (!config.draggable || config.preview || event.button !== 0 || event.target.closest('button')) return;
        dragging = { id: event.pointerId, x: event.clientX, y: event.clientY, target, captured: event.pointerType !== 'touch', both: event.pointerType !== 'touch' };
        if (dragging.captured) { root.setPointerCapture(event.pointerId); root.toggleAttribute('data-dragging', true); }
      });

      listen(root, 'pointermove', (event) => {
        if (!dragging || event.pointerId !== dragging.id) return;
        const dx = event.clientX - dragging.x, dy = event.clientY - dragging.y;
        if (!dragging.captured) {
          if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) { dragging = null; return; }
          if (Math.abs(dx) < 8) return;
          dragging.captured = true; root.setPointerCapture(event.pointerId); root.toggleAttribute('data-dragging', true);
        }
        holdUntil = performance.now() + 1400;
        target = dragging.target - (dx + (dragging.both ? dy : 0)) * config.sensitivity; wake();
      });

      function release(event) {
        if (dragging && event.pointerId === dragging.id) {
          dragging = null; root.removeAttribute('data-dragging');
          if (root.hasPointerCapture(event.pointerId)) root.releasePointerCapture(event.pointerId); wake();
        }
      }

      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) listen(root, type, release);

      listen(root, 'keydown', (event) => {
        if (event.target !== root || config.preview) return;
        if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) {
          event.preventDefault();
          if (event.key === 'Home') target = 0;
          else if (event.key === 'End') target = (images.length - 1) * stride;
          else step(event.key === 'ArrowRight' || event.key === 'ArrowDown' ? 1 : -1); wake();
        }
      });

      listen(root.querySelector('.sf-prev'), 'click', () => step(-1));
      listen(root.querySelector('.sf-next'), 'click', () => step(1));
      listen(motion, 'change', wake);
      listen(document, 'visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(frame); frame = 0; } else wake(); });

      const observer = new ResizeObserver(resize); observer.observe(root);
      const intersection = new IntersectionObserver((entries) => {
        visible = entries.some((entry) => entry.isIntersecting);
        if (visible) wake(); else { cancelAnimationFrame(frame); frame = 0; }
      }); intersection.observe(root);

      function update(next) {
        config = next; root.toggleAttribute('data-draggable', config.draggable && !config.preview);
        root.toggleAttribute('data-preview', config.preview); root.tabIndex = config.preview ? -1 : 0;
        if (!config.draggable && dragging) { const id = dragging.id; dragging = null; root.removeAttribute('data-dragging'); if (root.hasPointerCapture(id)) root.releasePointerCapture(id); }
        setImages(); resize(); wake();
      }

      update(initial);
      return {
        update,
        nudge(photos) { holdUntil = performance.now() + 1400; target += photos * stride; if (dragging) dragging.target += photos * stride; wake(); },
        destroy() {
          destroyed = true; cancelAnimationFrame(frame); observer.disconnect(); intersection.disconnect(); listeners.forEach((remove) => remove());
          if (dragging && root.hasPointerCapture(dragging.id)) root.releasePointerCapture(dragging.id);
          images.forEach((image) => { image.onload = null; image.onerror = null; }); canvas.width = 1; canvas.height = 1;
        }
      };
    }

    const engine = createSpiralFlux(document.querySelector('.sf-root'), {
      "viewportWidth": 1920,
      "viewportHeight": 1080,
      "cardArc": 45,
      "aspect": 1.05001,
      "gap": 0.500001,
      "size": 132,
      "turnSpacing": 2,
      "depth": 8,
      "tilt": 0.200001,
      "backFade": 0.149999,
      "wave": 0,
      "frequency": 0.9,
      "smoothing": 6,
      "sensitivity": 0.6,
      "autoplay": 30,
      "flare": 0,
      "edgeZone": 12,
      "smear": 0.149999,
      "fringe": 0,
      "wheel": "off",
      "draggable": true,
      "images": [
        "/works/1.jpg",
        "/works/2.jpg",
        "/works/3.jpg",
        "/works/4.jpg",
        "/works/5.jpg",
        "/works/6.jpg",
        "/works/7.jpg",
        "/works/8.jpg",
        "/works/9.jpg",
        "/works/10.jpg"
      ]
    });

    const track = document.querySelector('.sf-track');
    const PHOTOS_PER_SCROLL = 3;
    const progress = () => Math.min(1, Math.max(0, -track.getBoundingClientRect().top / (track.offsetHeight - innerHeight)));
    let lastProgress = progress();

    const stage = document.querySelector('.sf-export');
    const title = document.querySelector('.sf-title');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const INTRO_MS = 1400, introStart = performance.now();

    const reveal = () => {
      const intro = reducedMotion.matches ? 1 : Math.min(1, (performance.now() - introStart) / INTRO_MS);
      const scrub = reducedMotion.matches ? 1 : Math.min(1, Math.max(0, 1 - track.getBoundingClientRect().top / innerHeight));
      const t = Math.min(intro, scrub);
      const e = t * t * (3 - 2 * t), i = 1 - e;
      stage.style.clipPath = `inset(${(i * 14).toFixed(2)}% ${(i * 5).toFixed(2)}% ${(i * 14).toFixed(2)}% ${(i * 5).toFixed(2)}% round ${(i * 32).toFixed(1)}px)`;
      stage.style.transform = `scale(${(0.9 + 0.1 * e).toFixed(4)})`;
      title.style.opacity = e.toFixed(3);
      title.style.transform = `translate3d(0, ${(i * 30).toFixed(2)}px, 0)`;
    };

    const onScroll = () => {
      reveal();
      const p = progress();
      if (!reducedMotion.matches && p !== lastProgress) engine.nudge((p - lastProgress) * PHOTOS_PER_SCROLL);
      lastProgress = p;
    };

    const onResize = () => { lastProgress = progress(); reveal(); };
    const introLoop = () => { reveal(); if (performance.now() - introStart < INTRO_MS) requestAnimationFrame(introLoop); };
    introLoop();

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onResize);

    const dispose = () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onResize);
      engine.destroy();
      window.removeEventListener('pagehide', dispose);
    };
    window.addEventListener('pagehide', dispose, { once: true });
  </script>
</body>
</html>
